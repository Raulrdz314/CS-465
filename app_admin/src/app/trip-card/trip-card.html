<div class="card h-100">
  <img
    class="card-img-top"
    [src]="'http://localhost:3000' + trip.image"
    [alt]="trip.name"
  />

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-text">
      {{ trip.length }} nights<br />
      ${{ trip.perPerson }} per person
    </p>
  </div>

  
  <div class="card-footer text-center">
    <button class="btn btn-sm btn-primary me-2" (click)="editTrip()">
      Edit
    </button>
    <button class="btn btn-sm btn-danger" (click)="deleteTrip()">
      Delete
    </button>
  </div>
</div>
