<h2>Add Trip</h2>

<form (ngSubmit)="onSubmit()">
  <div>
    <label>Code</label><br />
    <input type="text" name="code" [(ngModel)]="trip.code" required />
  </div>

  <div>
    <label>Name</label><br />
    <input type="text" name="name" [(ngModel)]="trip.name" required />
  </div>

  <div>
    <label>Length (days)</label><br />
    <input type="number" name="length" [(ngModel)]="trip.length" required />
  </div>

  <div>
    <label>Start Date</label><br />
    <input type="date" name="start" [(ngModel)]="trip.start" required />
  </div>

  <div>
    <label>Resort</label><br />
    <input type="text" name="resort" [(ngModel)]="trip.resort" required />
  </div>

  <div>
    <label>Price per Person</label><br />
    <input type="number" name="perPerson" [(ngModel)]="trip.perPerson" required />
  </div>

  <div>
    <label>Image Path</label><br />
    <input type="text" name="image" [(ngModel)]="trip.image" />
  </div>

  <div>
    <label>Description</label><br />
    <textarea name="description" [(ngModel)]="trip.description"></textarea>
  </div>

  <br />

  <button type="submit">Add Trip</button>
</form>
