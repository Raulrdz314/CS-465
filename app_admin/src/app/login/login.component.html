<h2>Admin Login</h2>

<form (ngSubmit)="login()">
  <div>
    <label>Username</label><br />
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      required
    />
  </div>

  <br />

  <div>
    <label>Password</label><br />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      required
    />
  </div>

  <br />

  <button type="submit">Login</button>
</form>

<p *ngIf="errorMessage" style="color: red;">
  {{ errorMessage }}
</p>
